name: evals

# Runs a real Claude model against the planted-problem scenarios. Started by hand only,
# because every run calls the Claude API and costs money. Needs the ANTHROPIC_API_KEY
# repository secret.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model to evaluate
        default: claude-opus-5-5
      effort:
        description: Effort level
        default: medium
        type: choice
        options: [low, medium, high, xhigh, max]
      repeat:
        description: Runs per scenario
        default: "1"
      min-pass-rate:
        description: Fail the workflow below this share of passing runs (0 to 1)
        default: "0.8"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[eval]"
      - name: Run evals
        # Inputs go through env vars, never pasted into the script, to rule out injection.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          REPEAT: ${{ inputs.repeat }}
          MIN_PASS_RATE: ${{ inputs['min-pass-rate'] }}
        run: >
          python -m evals
          --model "$MODEL"
          --effort "$EFFORT"
          --repeat "$REPEAT"
          --min-pass-rate "$MIN_PASS_RATE"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
