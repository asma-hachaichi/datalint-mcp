name: release

# Push a tag like v0.1.0 to publish that version to PyPI, then to the MCP Registry.
#
# PyPI uses an API token in the PYPI_API_TOKEN secret, scoped to the datalint-mcp project.
# PyPI trusted publishing (OIDC) can't work for this repo yet: GitHub gives repositories
# created after July 15, 2026 an "immutable" OIDC subject (repo:owner@id/repo@id:...) that
# can't be switched off, and PyPI only accepts the classic one (pypi/warehouse#19405).
# Once PyPI supports it, go back to trusted publishing and delete the token.
#
# The MCP Registry still signs in with GitHub OIDC, so it needs no secret.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Check the tag matches every version in the repo
        env:
          TAG: ${{ github.ref_name }}
        run: python -m pytest -q tests/test_release.py --release-tag "$TAG"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false  # attestations need trusted publishing

  mcp-registry:
    needs: pypi  # the registry checks that the PyPI package exists
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MCP Registry login with GitHub OIDC
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
